name: Daily News & Macro Broadcasts

on:
  # 1. Triggered externally by cron-job.org
  repository_dispatch:
    types:
      - morning_companies_broadcast
      - evening_sectorial_broadcast

  # 2. Triggered manually from GitHub Web UI
  workflow_dispatch:
    inputs:
      target:
        description: 'Which broadcast to execute'
        required: true
        default: 'morning_companies_broadcast'
        type: choice
        options:
          - 'morning_companies_broadcast'
          - 'evening_sectorial_broadcast'
          - 'both'

  # 3. Native GitHub Actions Cron (UTC times for IST):
  #    03:30 UTC = 09:00 AM IST (Daily - 7 Days a Week)
  #    12:00 UTC = 05:30 PM IST (Daily - 7 Days a Week)
  schedule:
    - cron: '30 3 * * *'
    - cron: '0 12 * * *'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for Headless PDF Engine
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-liberation fonts-dejavu-core fonts-noto-core libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Morning Companies News Broadcast
        if: >
          github.event.action == 'morning_companies_broadcast' ||
          github.event.inputs.target == 'morning_companies_broadcast' ||
          github.event.inputs.target == 'both' ||
          github.event.schedule == '30 3 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          INTERAKT_TEMPLATE: vriddhi_daily_digest_49
          INTERAKT_MACRO_TEMPLATE: vriddhi_daily_digest_49
          TEST_MODE: "no"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting 9:00 AM Morning Companies News Broadcast..."
          python -m vriddhi_crawler run-daily

      - name: Execute Evening Sectorial & Macro News Broadcast
        if: >
          github.event.action == 'evening_sectorial_broadcast' ||
          github.event.inputs.target == 'evening_sectorial_broadcast' ||
          github.event.inputs.target == 'both' ||
          github.event.schedule == '0 12 * * *'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INTERAKT_API_KEY: ${{ secrets.INTERAKT_API_KEY }}
          BASE_URL: ${{ secrets.BASE_URL }}
          INTERAKT_TEMPLATE: vriddhi_daily_digest_49
          INTERAKT_MACRO_TEMPLATE: vriddhi_daily_digest_49
          TEST_MODE: "no"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting 5:30 PM Evening Sectorial & Macro News Broadcast..."
          python -m vriddhi_crawler macro-dispatch
